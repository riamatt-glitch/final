{% extends 'vulnmgmt/base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="card" style="width: 100%; max-width: 400px;">
    <div class="card-body p-4">
      <h1 class="h4 mb-1">🛡 RBVMS</h1>
      <p class="text-muted small mb-4">Risk-Based Vulnerability Assessment and Management System</p>
      {% if form.errors %}<div class="alert alert-danger py-2">Invalid username or password.</div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3"><label class="form-label" for="id_username">Username</label>
          <input class="form-control" name="username" id="id_username" autofocus required autocomplete="username"></div>
        <div class="mb-3"><label class="form-label" for="id_password">Password</label>
          <input class="form-control" type="password" name="password" id="id_password" required autocomplete="current-password"></div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary w-100">Sign in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
