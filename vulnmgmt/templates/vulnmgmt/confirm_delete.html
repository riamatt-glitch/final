{% extends 'vulnmgmt/base.html' %}
{% block title %}Delete {{ object }}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
  <div class="card"><div class="card-body">
    <h1 class="h4">Delete "{{ object }}"?</h1>
    <p>This also deletes all of its findings and remediation tasks. The deletion is recorded in the audit log.</p>
    <form method="post">{% csrf_token %}
      <button class="btn btn-danger">Delete</button>
      <a class="btn btn-link" href="{{ cancel.get_absolute_url }}">Cancel</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
